name: End-to-end

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/e2e.yml"
      - "resources/**"
      - "scripts/lib/**"
      - "tests/e2e/**"
  pull_request:
    paths:
      - ".github/workflows/e2e.yml"
      - "resources/**"
      - "scripts/lib/**"
      - "tests/e2e/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-stack:
    name: Synthetic AstroStack
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install DSC v3
        shell: pwsh
        run: |
          if (-not (Get-Command dsc -ErrorAction SilentlyContinue)) {
            winget install --exact --id Microsoft.DSC --silent `
              --accept-package-agreements --accept-source-agreements
          }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          "$machinePath;$userPath" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Exercise synthetic stack
        shell: pwsh
        run: ./tests/e2e/Invoke-EndToEnd.ps1
