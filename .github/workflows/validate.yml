name: Validate

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "assets/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PowerShell and manifests
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Pester
        shell: pwsh
        run: |
          $installed = Get-Module -ListAvailable Pester |
            Where-Object Version -ge 5.7.1 |
            Select-Object -First 1
          if (-not $installed) {
            Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Validate repository
        shell: pwsh
        run: ./scripts/Test-Repository.ps1
