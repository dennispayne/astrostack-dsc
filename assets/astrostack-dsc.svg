<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">AstroStack DSC</title>
  <description id="description">A telescope beneath a star field surrounded by configuration nodes.</description>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.5" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="238" fill="url(#sky)" stroke="#4338ca" stroke-width="8"/>

  <g fill="#e0f2fe">
    <circle cx="113" cy="126" r="4"/>
    <circle cx="178" cy="77" r="3"/>
    <circle cx="329" cy="91" r="4"/>
    <circle cx="402" cy="151" r="3"/>
    <circle cx="91" cy="231" r="2.5"/>
    <circle cx="426" cy="258" r="3"/>
    <circle cx="369" cy="210" r="2.5"/>
    <circle cx="244" cy="111" r="2"/>
  </g>

  <path d="M387 78l7 17 17 7-17 7-7 17-7-17-17-7 17-7z" fill="#f8fafc" filter="url(#glow)"/>
  <path d="M143 173l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#a5f3fc"/>

  <g stroke="#67e8f9" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M101 339L77 363"/>
    <path d="M411 339l24 24"/>
    <path d="M256 70V43"/>
  </g>
  <g fill="#0f172a" stroke="#a5f3fc" stroke-width="5">
    <circle cx="69" cy="371" r="13"/>
    <circle cx="443" cy="371" r="13"/>
    <circle cx="256" cy="34" r="13"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="69" cy="371" r="4"/>
    <circle cx="443" cy="371" r="4"/>
    <circle cx="256" cy="34" r="4"/>
  </g>

  <path d="M49 405c61-44 116-39 165-10 52-31 119-34 179 4 26-7 48-4 70 6v58H49z" fill="url(#ground)"/>

  <g transform="rotate(-28 252 245)">
    <rect x="157" y="197" width="205" height="88" rx="31" fill="#dbeafe" stroke="#0f172a" stroke-width="9"/>
    <rect x="309" y="196" width="53" height="90" rx="22" fill="url(#lens)" stroke="#0f172a" stroke-width="9"/>
    <rect x="143" y="214" width="35" height="54" rx="10" fill="#94a3b8" stroke="#0f172a" stroke-width="8"/>
    <path d="M202 204v75M225 202v79" stroke="#94a3b8" stroke-width="7"/>
  </g>

  <g stroke="#cbd5e1" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 290v45"/>
    <path d="M250 327l-72 117"/>
    <path d="M250 327l76 117"/>
    <path d="M250 327v117"/>
  </g>
  <circle cx="250" cy="302" r="22" fill="#6366f1" stroke="#e0e7ff" stroke-width="7"/>

  <g transform="translate(344 300)">
    <circle cx="0" cy="0" r="50" fill="#111827" stroke="#a5f3fc" stroke-width="6"/>
    <g fill="#818cf8">
      <rect x="-8" y="-67" width="16" height="27" rx="4"/>
      <rect x="-8" y="40" width="16" height="27" rx="4"/>
      <rect x="-67" y="-8" width="27" height="16" rx="4"/>
      <rect x="40" y="-8" width="27" height="16" rx="4"/>
      <rect x="-8" y="-67" width="16" height="27" rx="4" transform="rotate(45)"/>
      <rect x="-8" y="-67" width="16" height="27" rx="4" transform="rotate(90)"/>
      <rect x="-8" y="-67" width="16" height="27" rx="4" transform="rotate(135)"/>
      <rect x="-8" y="-67" width="16" height="27" rx="4" transform="rotate(225)"/>
    </g>
    <circle cx="0" cy="0" r="20" fill="#67e8f9"/>
    <circle cx="0" cy="0" r="8" fill="#172554"/>
  </g>
</svg>
